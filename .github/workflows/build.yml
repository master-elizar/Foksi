name: Build Foksi APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.console=plain -Dorg.gradle.welcome=never
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        timeout-minutes: 25
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        timeout-minutes: 30
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build release APK
        timeout-minutes: 30
        run: ./gradlew :app:assembleRelease --console=plain

      - name: List outputs
        if: always()
        run: find app/build/outputs -name '*.apk' -exec ls -lh {} + || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foksi-apk
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish release with installable APKs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="build-${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/foksi-${TAG}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/foksi-${TAG}-debug.apk"
          gh release create "$TAG" dist/*.apk \
            --title "Foksi $TAG" \
            --notes "Сборка Foksi из ${GITHUB_SHA}. Для установки на телефон скачай foksi-${TAG}-release.apk." \
            --target "$GITHUB_SHA"
