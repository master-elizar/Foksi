name: Build Foksi APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.console=plain -Dorg.gradle.welcome=never
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        timeout-minutes: 25
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain

      - name: Build debug APK
        timeout-minutes: 30
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Build release APK
        timeout-minutes: 30
        run: ./gradlew :app:assembleRelease --stacktrace --console=plain

      - name: List outputs
        if: always()
        run: find app/build/outputs -name '*.apk' -exec ls -lh {} + || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foksi-apk
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
